<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expenses</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
</head>
<body>

<header>
  <div class="wrap hd">
    <div class="logo"><span class="dot"></span> Expenses</div>
    <div class="spacer"></div>
    <div class="ctl">
      <input type="text" id="q" placeholder="Search merchant, note…" autocomplete="off">
      <select id="month"></select>
      <button class="btn" id="add">+ Manual</button>
      <button class="btn gh hide-s" id="csv">Export CSV</button>
      <button class="btn pri" id="pick">Add screenshots</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="drop" id="drop">
    <h2>Drop expense screenshots here</h2>
    <p>Or paste with ⌘V, click to browse, or drop files into <code id="inboxpath">inbox/</code> and they get read and logged automatically.</p>
  </div>

  <div id="pipe"></div>
  <div class="stats" id="stats"></div>
  <div class="grid" id="charts"></div>

  <div class="tblhd">
    <h3 id="tbltitle">Transactions</h3>
    <div class="spacer" style="flex:1"></div>
    <span class="chip" id="revchip" hidden></span>
  </div>
  <div id="table"></div>
</div>

<input type="file" id="file" accept="image/*,.pdf,.heic" multiple hidden>

<div class="lb" id="lb"><img id="lbimg" alt="Screenshot"></div>

<div class="modal" id="modal">
  <div class="card">
    <h3>Add an expense manually</h3>
    <div class="f"><label>Merchant</label><input type="text" id="m_merchant" placeholder="Blue Tokai"></div>
    <div class="row2">
      <div class="f"><label>Amount</label><input type="number" id="m_amount" step="0.01" placeholder="0.00"></div>
      <div class="f"><label>Currency</label><input type="text" id="m_currency" value="INR" maxlength="3"></div>
    </div>
    <div class="row2">
      <div class="f"><label>Date</label><input type="date" id="m_date"></div>
      <div class="f"><label>Time</label><input type="time" id="m_time"></div>
    </div>
    <div class="row2">
      <div class="f"><label>Category</label><select id="m_cat"></select></div>
      <div class="f"><label>Direction</label>
        <select id="m_dir"><option value="debit">Spent</option><option value="credit">Received</option></select>
      </div>
    </div>
    <div class="f"><label>Note</label><input type="text" id="m_note" placeholder="optional"></div>
    <div class="acts">
      <button class="btn gh" id="m_cancel">Cancel</button>
      <button class="btn pri" id="m_save">Save</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
